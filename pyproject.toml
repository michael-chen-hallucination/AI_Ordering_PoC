[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ordering-poc"
version = "0.1.0"
description = "A sanitized real-time AI voice ordering proof of concept"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3>=1.34,<2",
    "Flask>=3.0,<4",
    "flask-sock>=0.7,<1",
    "gTTS>=2.5,<3",
    "pydub>=0.25,<1",
    "requests>=2.31,<3",
    "twilio>=9,<10",
]

[project.optional-dependencies]
speech = ["vosk>=0.3.45,<1"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
